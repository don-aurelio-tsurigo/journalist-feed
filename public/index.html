<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tsüri Newsfeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0d0d;
    --ink-soft: #55575c;
    --paper: #ffffff;
    --line: #e7e7e7;
    --blue: #4fa3e0;
    --blue-deep: #1c7dc4;
    --blue-tint: #cfe9fb;
    --warn: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header {
    background: var(--paper);
    border-bottom: 3px solid var(--ink);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .wordmark {
    font-family: "Archivo Black", "Inter", sans-serif;
    font-size: 26px;
    letter-spacing: 0.5px;
    color: var(--ink);
  }
  .brand .sub {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  #refreshBtn {
    background: var(--ink);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  #refreshBtn:hover { background: var(--blue-deep); }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tabs.sources { margin-bottom: 22px; }
  .tab {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--ink);
    cursor: pointer;
    border: 2px solid var(--ink);
    background: var(--paper);
    user-select: none;
  }
  .tab.active {
    background: var(--ink);
    color: white;
  }
  .tab:not(.active):hover { background: var(--blue-tint); }
  .tabs.sources .tab {
    border-color: var(--blue);
    color: var(--blue-deep);
    font-size: 11px;
    padding: 6px 12px;
  }
  .tabs.sources .tab.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }
  .tabs.sources .tab:not(.active):hover { background: var(--blue-tint); }

  .item {
    background: var(--blue-tint);
    padding: 4px;
    margin-bottom: 20px;
  }
  .item-inner {
    background: var(--paper);
    padding: 16px 18px 18px;
  }
  .tag {
    display: inline-block;
    background: var(--ink);
    color: white;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 4px 10px;
    margin-bottom: 10px;
  }
  .item h2 {
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 19px;
    line-height: 1.3;
    margin: 0 0 8px;
    letter-spacing: -0.1px;
  }
  .item h2 a { color: var(--ink); text-decoration: none; }
  .item h2 a:hover { color: var(--blue-deep); }
  .item .byline {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .item p.summary {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0 0 14px;
  }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button {
    font-size: 12px;
    font-weight: 700;
    padding: 7px 14px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .actions button:hover { background: var(--blue-tint); }
  .actions button.danger:hover { border-color: var(--warn); color: var(--warn); background: white; }
  .actions button.primary {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
  }
  .actions button.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
  .actions button:disabled { opacity: 0.5; cursor: default; }

  .draft {
    margin-top: 14px;
    border-top: 2px dashed var(--line);
    padding-top: 14px;
  }
  .draft textarea {
    width: 100%;
    min-height: 170px;
    font-family: "Inter", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    padding: 12px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    resize: vertical;
  }
  .draft .draft-meta {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .draft label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--ink-soft);
    margin: 12px 0 4px;
  }
  .draft label:first-child { margin-top: 0; }
  .draft input[type="text"] {
    width: 100%;
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 16px;
    padding: 10px 12px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
  }
  .draft textarea.lead {
    min-height: 60px;
    font-weight: 600;
  }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 0;
    font-size: 14px;
    font-weight: 600;
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,13,13,0.6);
    z-index: 100;
    padding: 30px 20px;
  }
  .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }
  .modal {
    background: var(--paper);
    width: 100%;
    max-width: 900px;
    max-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    border: 3px solid var(--ink);
  }
  .modal-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 3px solid var(--ink);
    background: var(--blue-tint);
  }
  .modal-bar .modal-title {
    font-size: 13px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .modal-bar-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .modal-bar-actions a, .modal-bar-actions button {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 6px 12px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
  }
  .modal-bar-actions a:hover, .modal-bar-actions button:hover { background: var(--ink); color: white; }
  .modal iframe {
    flex: 1;
    width: 100%;
    border: none;
    min-height: 60vh;
    background: white;
  }
  .modal .iframe-fallback {
    display: none;
    padding: 30px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .modal .iframe-fallback.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="wordmark">TSÜRI</span>
    <span class="sub">Newsfeed</span>
  </div>
  <button id="refreshBtn">Jetzt aktualisieren</button>
</header>

<main>
  <div class="tabs" id="tabs">
    <div class="tab active" data-status="neu">Neu</div>
    <div class="tab" data-status="interessant">Interessant</div>
    <div class="tab" data-status="beobachten">Beobachten</div>
    <div class="tab" data-status="verworfen">Verworfen</div>
    <div class="tab" data-status="">Alle</div>
  </div>
  <div class="tabs sources" id="sourceTabs">
    <div class="tab active" data-source="">Alle Quellen</div>
  </div>
  <div id="list"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-bar">
      <span class="modal-title" id="modalTitle"></span>
      <div class="modal-bar-actions">
        <a id="modalOpenNewTab" href="#" target="_blank" rel="noopener">Neuer Tab</a>
        <button id="modalClose">Schliessen</button>
      </div>
    </div>
    <iframe id="modalFrame"></iframe>
    <div class="iframe-fallback" id="modalFallback">
      Diese Seite lässt sich nicht eingebettet anzeigen (blockiert das per Sicherheits-Header).
      Bitte über "Neuer Tab" öffnen.
    </div>
  </div>
</div>

<script>
  let currentStatus = "neu";
  let currentSource = "";

  const tabsEl = document.getElementById("tabs");
  const sourceTabsEl = document.getElementById("sourceTabs");
  const listEl = document.getElementById("list");
  const refreshBtn = document.getElementById("refreshBtn");

  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalFrame = document.getElementById("modalFrame");
  const modalTitle = document.getElementById("modalTitle");
  const modalOpenNewTab = document.getElementById("modalOpenNewTab");
  const modalClose = document.getElementById("modalClose");
  const modalFallback = document.getElementById("modalFallback");
  let fallbackTimer = null;

  function openModal(link, title) {
    modalTitle.textContent = title;
    modalOpenNewTab.href = link;
    modalFallback.classList.remove("show");
    modalFrame.style.display = "block";
    modalFrame.src = link;
    modalBackdrop.classList.add("open");
    document.body.style.overflow = "hidden";

    // Manche Seiten blockieren das Einbetten per X-Frame-Options/CSP. Der
    // Browser meldet das nicht direkt an uns - Heuristik: wenn nach kurzer
    // Zeit kein "load" ausgelöst wurde, zeigen wir den Fallback-Hinweis.
    let loaded = false;
    modalFrame.onload = () => { loaded = true; };
    clearTimeout(fallbackTimer);
    fallbackTimer = setTimeout(() => {
      if (!loaded) {
        modalFrame.style.display = "none";
        modalFallback.classList.add("show");
      }
    }, 3500);
  }

  function closeModal() {
    modalBackdrop.classList.remove("open");
    modalFrame.src = "about:blank";
    document.body.style.overflow = "";
    clearTimeout(fallbackTimer);
  }

  modalClose.addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalBackdrop.classList.contains("open")) closeModal();
  });

  tabsEl.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll("#tabs .tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    currentStatus = tab.dataset.status;
    loadItems();
  });

  sourceTabsEl.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll("#sourceTabs .tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    currentSource = tab.dataset.source;
    loadItems();
  });

  async function loadSources() {
    try {
      const res = await fetch("/api/sources");
      const sources = await res.json();
      sources.forEach((s) => {
        const tab = document.createElement("div");
        tab.className = "tab";
        tab.dataset.source = s.key;
        tab.textContent = s.label;
        sourceTabsEl.appendChild(tab);
      });
    } catch {
      // Quellen-Filter ist ein Nice-to-have - bei Fehler bleibt einfach nur "Alle Quellen" stehen.
    }
  }

  refreshBtn.addEventListener("click", async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Lädt Quellen …";
    try {
      await fetch("/api/run", { method: "POST" });
      await loadItems();
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Jetzt aktualisieren";
    }
  });

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString("de-CH", { day: "2-digit", month: "long", year: "numeric" });
  }

  async function setStatus(id, status) {
    await fetch(`/api/items/${encodeURIComponent(id)}/status`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    loadItems();
  }

  async function generateDraft(id, button, draftBox) {
    button.disabled = true;
    const original = button.textContent;
    button.textContent = "Entwirft …";
    try {
      const res = await fetch(`/api/items/${encodeURIComponent(id)}/draft`, { method: "POST" });
      const data = await res.json();
      if (!res.ok) {
        draftBox.innerHTML = `<p style="color:var(--warn); font-weight:600;">Fehler: ${data.error || "unbekannt"}</p>`;
        return;
      }
      renderDraftBox(draftBox, data.draft_title, data.draft_lead, data.draft_text, data.draft_generated_at);
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  }

  function renderDraftBox(draftBox, title, lead, body, generatedAt) {
    draftBox.innerHTML = `
      <label>Titel</label>
      <input type="text" value="${(title || "").replace(/"/g, "&quot;")}" />
      <label>Lead</label>
      <textarea class="lead">${lead || ""}</textarea>
      <label>Text</label>
      <textarea>${body || ""}</textarea>
      <div class="draft-meta">Entwurf erzeugt ${formatDate(generatedAt)} · vor dem Publizieren gegenlesen</div>
    `;
  }

  function renderItem(item) {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-inner">
        <span class="tag">${item.source_label}</span>
        <h2><a href="${item.link}" data-open-modal>${item.title}</a></h2>
        <div class="byline">${formatDate(item.published_at || item.fetched_at)}</div>
        <p class="summary">${item.summary || ""}</p>
        <div class="actions"></div>
        <div class="draft"></div>
      </div>
    `;
    const titleLink = div.querySelector("h2 a");
    titleLink.addEventListener("click", async (e) => {
      e.preventDefault();
      titleLink.style.opacity = "0.6";
      try {
        const res = await fetch(`/api/check-embeddable?url=${encodeURIComponent(item.link)}`);
        const data = await res.json();
        if (data.embeddable === false) {
          window.open(item.link, "_blank", "noopener");
        } else {
          openModal(item.link, item.title);
        }
      } catch {
        // Check selbst fehlgeschlagen -> im Zweifel Modal versuchen,
        // der Zeit-Fallback im Modal greift dann als zweite Absicherung.
        openModal(item.link, item.title);
      } finally {
        titleLink.style.opacity = "";
      }
    });

    const actions = div.querySelector(".actions");
    const draftBox = div.querySelector(".draft");

    const draftBtn = document.createElement("button");
    draftBtn.className = "primary";
    draftBtn.textContent = item.draft_text ? "Artikel neu entwerfen" : "Artikel entwerfen";
    draftBtn.addEventListener("click", () => generateDraft(item.id, draftBtn, draftBox));
    actions.appendChild(draftBtn);

    const buttons = [
      ["interessant", "Interessant"],
      ["beobachten", "Beobachten"],
      ["verworfen", "Verwerfen"],
    ].filter(([s]) => s !== item.status);

    buttons.forEach(([status, label]) => {
      const btn = document.createElement("button");
      btn.textContent = label;
      if (status === "verworfen") btn.className = "danger";
      btn.addEventListener("click", () => setStatus(item.id, status));
      actions.appendChild(btn);
    });

    if (item.draft_text) {
      renderDraftBox(draftBox, item.draft_title, item.draft_lead, item.draft_text, item.draft_generated_at);
    }

    return div;
  }

  async function loadItems() {
    const params = new URLSearchParams();
    if (currentStatus) params.set("status", currentStatus);
    if (currentSource) params.set("source", currentSource);
    params.set("limit", "100");
    const res = await fetch(`/api/items?${params}`);
    const items = await res.json();
    listEl.innerHTML = "";
    if (!items.length) {
      listEl.innerHTML = '<div class="empty">Keine Einträge in dieser Ansicht.</div>';
      return;
    }
    items.forEach((item) => listEl.appendChild(renderItem(item)));
  }

  loadSources();
  loadItems();
</script>

</body>
</html>
