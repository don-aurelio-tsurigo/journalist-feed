name = "journalist-feed"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Statisches Frontend (public/) wird über den ASSETS-Binding ausgeliefert.
[assets]
directory = "./public"
binding = "ASSETS"

# D1-Datenbank. database_id nach dem Anlegen der DB ersetzen:
#   npx wrangler d1 create tsri-news-feed-db
[[d1_databases]]
binding = "DB"
database_name = "tsri-news-feed-db"
database_id = "b4f5dc5b-1346-41fb-b8a5-305c15a26645"

# Holt alle 15 Minuten neue Einträge von den Quellen.
[triggers]
crons = ["*/15 * * * *"]

# Cloudflare Access für dieses Tool separat in Zero Trust > Access > Applications
# einrichten (Pfad: das komplette Worker-Domain/Route). Nicht Teil dieser Config,
# da Access-Policies meist über das Dashboard oder Terraform verwaltet werden.
